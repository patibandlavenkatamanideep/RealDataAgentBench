[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realdataagentbench"
version = "0.1.0"
description = "A benchmark for evaluating LLM agents on data science tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "RestrictedPython>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    # scripts/audit_model_availability.py imports httpx directly. It arrived
    # transitively via anthropic/openai until it didn't, which is what the audit job
    # failing on ModuleNotFoundError was telling us.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
dab = "realdataagentbench.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["realdataagentbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["realdataagentbench"]
omit = ["tests/*"]
