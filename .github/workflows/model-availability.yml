name: Model availability

# A leaderboard row is only evidence if the same command still runs. Providers retire
# models and SDKs drop parameters without touching this repo, so check on a schedule
# rather than waiting for the next manual benchmark run. See REPRODUCIBILITY.md.
on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays, 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "realdataagentbench/harness/providers.py"
      - "scripts/audit_model_availability.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Are the models behind the leaderboard still callable?
        # Providers without a secret are reported as unchecked and never fail the build.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/audit_model_availability.py --check
